version: '3.8'

services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: market_ai_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: market_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - market_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: market_ai_redis
    ports:
      - "6379:6379"
    networks:
      - market_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. AI Engine (Ollama with Llama 3.2) - THE BRAIN
  ollama:
    image: ollama/ollama:latest
    container_name: market_ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - market_net
    restart: always
    # Auto-pull the model when container starts
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling AI Model (Llama 3.2)... This may take a few minutes on first run.';
      ollama pull llama3.2;
      echo 'Starting Ollama Server...';
      ollama serve
      "

  # 4. Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: market_ai_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/market_ai
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      SECRET_KEY: supersecretkey_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - market_net
    restart: always

  # 5. Frontend (React)
  frontend:
    build: ./frontend
    container_name: market_ai_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - market_net
    restart: always

volumes:
  pgdata:
  ollama_data:

networks:
  market_net:
    driver: bridge
